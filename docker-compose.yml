x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  PYTHONPATH: /opt/airflow
  ENERGY_DATA_DIR: /opt/airflow/data
  ENERGY_SQL_DIR: /opt/airflow/sql
  ENERGY_DB_URI: postgresql+psycopg2://airflow:airflow@postgres:5432/energy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-energy-db.sql:/docker-entrypoint-initdb.d/init-energy-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow:
    build: .
    environment: *airflow-env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./dags:/opt/airflow/dags
      - ./pipeline:/opt/airflow/pipeline
      - ./sql:/opt/airflow/sql
      - ./tests:/opt/airflow/tests
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username admin --password admin --firstname Admin
                --lastname User --role Admin --email admin@example.com || true) &&
               airflow standalone"

volumes:
  pgdata:
